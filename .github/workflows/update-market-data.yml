name: Update Market Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore market data caches
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/cache_fundamentals
          key: market-data-cache-${{ github.run_id }}
          restore-keys: |
            market-data-cache-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Generate web snapshot
        run: python main.py --quiet --no-charts --no-html

      - name: Generate Buffett and fair value snapshot
        run: python buffett_main.py --quiet

      - name: Generate silent accumulation snapshot
        run: python silent_accumulation_main.py

      - name: Publish market data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R output/web/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          cd "$publish_dir"
          git init
          git checkout -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update market data ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin market-data
